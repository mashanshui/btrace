import org.gradle.api.publish.maven.MavenPublication

apply plugin: 'maven-publish'
apply plugin: 'signing'

ext["LOCAL_URL"] = ''

ext["signing.keyId"] = ''
ext["signing.password"] = ''
ext["signing.secretKeyRingFile"] = ''
ext["ossrhUsername"] = ''
ext["ossrhPassword"] = ''

File secretPropsFile = project.rootProject.file('local.properties')
if (secretPropsFile.exists()) {
    Properties p = new Properties()
    p.load(new FileInputStream(secretPropsFile))
    p.each { name, value ->
        ext[name] = value
    }
} else {
    ext["signing.keyId"] = System.getenv('SIGNING_KEY_ID')
    ext["signing.password"] = System.getenv('SIGNING_PASSWORD')
    ext["signing.secretKeyRingFile"] = System.getenv('SIGNING_SECRET_KEY_RING_FILE')
    ext["ossrhUsername"] = System.getenv('OSSRH_USERNAME')
    ext["ossrhPassword"] = System.getenv('OSSRH_PASSWORD')
}

def isReleaseBuild() {
    return !POM_VERSION_NAME.contains("SNAPSHOT")
}

def getSnapshotUrl() {
    String localUrl = LOCAL_URL
    if (localUrl) {
        return uri(localUrl)
    }
    return "https://oss.sonatype.org/content/repositories/snapshots/"
}

afterEvaluate {
    publishing {
        publications {
            maven(MavenPublication) {
                groupId = POM_GROUP_ID
                artifactId = POM_ARTIFACT_ID
                version = POM_VERSION_NAME

                if (plugins.hasPlugin('com.android.library')) {
                    from components.release

                    def sourcesTask = tasks.findByName('androidSourcesJar')
                    if (sourcesTask != null) {
                        artifact sourcesTask
                    }
                    def javadocsTask = tasks.findByName('androidJavadocsJar')
                    if (javadocsTask != null) {
                        artifact javadocsTask
                    }
                } else if (plugins.hasPlugin('java-library')) {
                    from components.java

                    def sourcesTask = tasks.findByName('sourcesJar')
                    if (sourcesTask != null) {
                        artifact sourcesTask
                    }
                    def javadocsTask = tasks.findByName('javadocJar')
                    if (javadocsTask != null) {
                        artifact javadocsTask
                    }
                }

                pom {
                    name = POM_NAME
                    description = POM_DESCRIPTION
                    url = POM_URL

                    scm {
                        url = POM_SCM_URL
                        connection = POM_SCM_CONNECTION
                        developerConnection = POM_SCM_DEV_CONNECTION
                    }

                    licenses {
                        license {
                            name = POM_LICENCE_NAME
                            url = POM_LICENCE_URL
                            distribution = POM_LICENCE_DIST
                        }
                    }

                    developers {
                        developer {
                            id = POM_DEVELOPER_ID
                            name = POM_DEVELOPER_NAME
                            email = POM_DEVELOPER_EMAIL
                        }
                    }
                }
            }
        }

        repositories {
            maven {
                name = 'sonatype'
                url = uri(isReleaseBuild()
                        ? "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
                        : getSnapshotUrl())
                credentials {
                    username = ossrhUsername
                    password = ossrhPassword
                }
            }
        }
    }

    // Keep the old task name as a compatibility entry point for existing callers.
    tasks.register('uploadArchives') {
        dependsOn 'publish'
    }

    signing {
        required {
            isReleaseBuild() && (gradle.taskGraph.hasTask('publish') || gradle.taskGraph.hasTask('uploadArchives'))
        }
        sign publishing.publications.maven
    }
}
